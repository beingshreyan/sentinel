<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Sentinel"
    >

    <title>Sentinel</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .landing {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px;

            text-align: center;
        }

        .landing-content {
            width: min(760px, 100%);
        }

        .landing-logo {
            margin-bottom: 22px;

            font-size: 1rem;
            font-weight: 800;

            letter-spacing: 0.22em;
        }

        .landing-title {
            margin: 0;

            font-size: clamp(3.5rem, 10vw, 7rem);
            line-height: 0.95;

            letter-spacing: -0.06em;
        }

        .landing-title span {
            background:
                linear-gradient(
                    90deg,
                    #ffffff,
                    #8d82ff,
                    #ffffff
                );

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;
        }

        .landing-subtitle {
            max-width: 560px;

            margin: 28px auto 0;

            color: var(--text-secondary);

            font-size: 1rem;
            line-height: 1.8;
        }

        .landing-button {
            display: inline-flex;

            margin-top: 34px;

            padding: 13px 24px;

            border-radius: var(--radius-sm);

            background: var(--accent);
            color: #ffffff;

            font-weight: 700;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }

        .landing-button:hover {
            background: var(--accent-hover);

            transform: translateY(-1px);
        }
    </style>
</head>

<body>

    <main class="landing">

        <div class="landing-content">

            <div class="landing-logo">
                SENTINEL
            </div>

            <h1 class="landing-title">
                <span>Experience</span>
                <br>
                Better.
            </h1>

            <p class="landing-subtitle">
                A simple, modern experience built around
                quality, performance and precision.
            </p>

            <a
                href="user.html"
                class="landing-button"
            >
                Explore
            </a>

        </div>

    </main>

</body>
</html>
